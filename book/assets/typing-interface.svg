<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="title desc">
<title id="title">Статический тип остаётся any</title>
<desc id="desc">В переменную x типа any сначала помещают int со значением 42, затем string со значением hello. Статический тип не меняется, меняются динамический тип и значение внутри.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#192c44;font-size:22px}.title{font-size:28px;font-weight:700}.label{font-weight:700}.note{font-size:20px;fill:#52657c}</style>
<rect width="680" height="420" fill="white"/>
<text x="28" y="46" class="title">Статический тип x остаётся any</text>
<rect x="28" y="78" width="624" height="274" rx="12" fill="#f2f4f7" stroke="#8796a8"/>
<text x="48" y="116" class="label">Одна переменная x, один контракт: any</text>
<rect x="48" y="150" width="264" height="158" rx="9" fill="#e8effb" stroke="#185bc7"/>
<text x="66" y="186" class="label">var x any = 42</text>
<text x="66" y="233">Тип внутри: int</text>
<text x="66" y="271">Значение: 42</text>
<path d="M312 229H356" fill="none" stroke="#185bc7" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="368" y="150" width="264" height="158" rx="9" fill="#e8f5f1" stroke="#23715d"/>
<text x="386" y="186" class="label">x = "hello"</text>
<text x="386" y="233">Тип внутри: string</text>
<text x="386" y="271">Значение: "hello"</text>
<text x="28" y="391" class="note">%T показывает тип внутри. Он не меняет статический тип x.</text>
</svg>
