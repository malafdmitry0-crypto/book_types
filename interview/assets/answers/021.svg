<svg xmlns="http://www.w3.org/2000/svg" width="600" height="504" viewBox="0 0 600 504" role="img" aria-labelledby="title desc"><title id="title">Сужение теряет биты навсегда</title><desc id="desc">Из int16(255) остаются восемь единиц. В int8 это −1. При расширении знак копируется в старшие биты, поэтому исходные 255 не восстанавливаются.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="504" fill="#fff"/><text x="28" y="44" class="title">Сужение теряет биты навсегда</text><rect x="28" y="80" width="544" height="94" rx="10" class="value"/><text x="46" y="111" class="label">int16: 255</text><text x="46" y="145" class="body">00000000 11111111</text><path d="M 300 174 V 216" class="arrow" marker-end="url(#tip)"/><text x="322" y="200" class="small">оставить 8 бит</text><rect x="28" y="224" width="544" height="94" rx="10" class="stop"/><text x="46" y="255" class="label">int8: −1</text><text x="46" y="289" class="body">11111111</text><path d="M 300 318 V 360" class="arrow" marker-end="url(#tip)"/><text x="322" y="344" class="small">расширить знак</text><rect x="28" y="368" width="544" height="104" rx="10" class="value"/><text x="46" y="399" class="label">int16: −1</text><text x="46" y="433" class="body">11111111 11111111</text></svg>
