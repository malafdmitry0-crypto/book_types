<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-labelledby="title desc"><title id="title">Копия числа и копия адреса</title><desc id="desc">Состояние после x := 10; y := x; p := &amp;x; *p = 20.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:25px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#52657c}.mono{font-family:Consolas,monospace;font-size:21px;font-weight:700}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.pointer{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.rule{stroke:#dbe3ef;stroke-width:1.5}</style><rect width="680" height="430" fill="#fff"/><text x="28" y="42" class="title">Копия числа и копия адреса</text><text x="28" y="73" class="small">Состояние после x := 10; y := x; p := &amp;x; *p = 20.</text><rect x="28" y="110" width="215" height="108" rx="10" class="pointer"/><text x="46" y="140" class="mono">p: *int</text><text x="46" y="170" class="body">адрес x</text><rect x="410" y="110" width="242" height="108" rx="10" class="value"/><text x="428" y="140" class="mono">x: int</text><text x="428" y="170" class="body">10 → 20</text><path d="M 243 164 H 398" class="arrow" marker-end="url(#tip)"/><text x="255" y="145" class="small">разыменование</text><rect x="410" y="270" width="242" height="100" rx="10" class="value"/><text x="428" y="300" class="mono">y: int</text><text x="428" y="330" class="body">10 — без изменений</text><text x="28" y="296" class="body">y получил число 10.</text><text x="28" y="324" class="body">У него своя ячейка.</text><text x="28" y="402" class="small">p указывает на x; y не связан с последующими изменениями x.</text></svg>
