<svg xmlns="http://www.w3.org/2000/svg" width="680" height="435" viewBox="0 0 680 435" role="img" aria-labelledby="title desc"><title id="title">nil-указатель внутри ≠ nil-интерфейс</title><desc id="desc">Проверяем наличие динамического типа и значения.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:25px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#52657c}.mono{font-family:Consolas,monospace;font-size:21px;font-weight:700}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.pointer{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.rule{stroke:#dbe3ef;stroke-width:1.5}</style><rect width="680" height="435" fill="#fff"/><text x="28" y="42" class="title">nil-указатель внутри ≠ nil-интерфейс</text><text x="28" y="73" class="small">Проверяем наличие динамического типа и значения.</text><rect x="28" y="110" width="298" height="180" rx="10" class="empty"/><text x="46" y="140" class="mono">var empty Incrementer</text><text x="46" y="170" class="body">тип: отсутствует</text><text x="46" y="196" class="body">значение: отсутствует</text><text x="46" y="222" class="body">empty == nil → true</text><rect x="350" y="110" width="302" height="180" rx="10" class="pointer"/><text x="368" y="140" class="mono">i = (*Counter)(nil)</text><text x="368" y="170" class="body">тип: *Counter</text><text x="368" y="196" class="body">значение: nil</text><text x="368" y="222" class="body">i == nil → false</text><text x="28" y="345" class="body">У i есть динамический тип *Counter.</text><text x="28" y="378" class="body">i.Inc() войдёт в метод с nil-получателем;</text><text x="28" y="408" class="body">обращение к c.N в нашем методе вызовет панику.</text></svg>
