<svg xmlns="http://www.w3.org/2000/svg" width="600" height="408" viewBox="0 0 600 408" role="img" aria-labelledby="title desc"><title id="title">Повторяется выражение, не результат</title><desc id="desc">У b повторяется 1 &lt;&lt; iota с новым iota. У d повторяется уже выражение 10, в котором iota не используется.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="408" fill="#fff"/><text x="28" y="44" class="title">Повторяется выражение, не результат</text><text x="28" y="98" class="small">iota</text><text x="115" y="98" class="small">Имя</text><text x="220" y="98" class="small">Выражение</text><text x="470" y="98" class="small">Итог</text><rect x="20" y="117" width="560" height="48" rx="5" class="value"/><text x="34" y="149" class="body">0</text><text x="122" y="149" class="body">a</text><text x="230" y="149" class="body">1 &lt;&lt; 0</text><text x="484" y="149" class="body">1</text><rect x="20" y="173" width="560" height="48" rx="5" class="value"/><text x="34" y="205" class="body">1</text><text x="122" y="205" class="body">b</text><text x="230" y="205" class="body">1 &lt;&lt; 1</text><text x="484" y="205" class="body">2</text><rect x="20" y="229" width="560" height="48" rx="5" class="shared"/><text x="34" y="261" class="body">2</text><text x="122" y="261" class="body">c</text><text x="230" y="261" class="body">10</text><text x="484" y="261" class="body">10</text><rect x="20" y="285" width="560" height="48" rx="5" class="shared"/><text x="34" y="317" class="body">3</text><text x="122" y="317" class="body">d</text><text x="230" y="317" class="body">10</text><text x="484" y="317" class="body">10</text><text x="28" y="384" class="small">Новая строка меняет iota, но не добавляет его в 10.</text></svg>
