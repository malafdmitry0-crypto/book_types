<svg xmlns="http://www.w3.org/2000/svg" width="680" height="684" viewBox="0 0 680 684" role="img" aria-labelledby="title desc"><title id="title">Интерфейс → reflect.Type и reflect.Value</title><desc id="desc">u := User{Age: 30}; var x any = u. TypeOf исследует тип, ValueOf — переданное значение.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:22px}.small{font-size:20px;fill:#52657c}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}</style><rect width="680" height="684" fill="white"/><text x="28" y="44" class="title">Интерфейс → reflect.Type и reflect.Value</text><text x="28" y="86" class="small">u := User{Age: 30}; var x any = u</text><rect x="28" y="110" width="624" height="192" rx="12" class="empty"/><text x="48" y="148" class="label">x: any — интерфейсное значение</text><rect x="48" y="170" width="275" height="106" rx="10" class="value"/><text x="66" y="202" class="label">Конкретный тип</text><text x="66" y="236" class="body">User</text><rect x="357" y="170" width="275" height="106" rx="10" class="shared"/><text x="375" y="202" class="label">Конкретное значение</text><text x="375" y="236" class="body">копия User{Age: 30}</text><path d="M 185 276 V 363" class="arrow" marker-end="url(#tip)"/><text x="55" y="339" class="small">TypeOf(x)</text><path d="M 493 276 V 363" class="arrow" marker-end="url(#tip)"/><text x="507" y="339" class="small">ValueOf(x)</text><rect x="28" y="375" width="294" height="208" rx="10" class="value"/><text x="46" y="407" class="label">t: reflect.Type</text><text x="46" y="441" class="body">Name(): User</text><text x="46" y="471" class="body">Kind(): struct</text><text x="46" y="501" class="body">Поле Age: тип int</text><text x="46" y="531" class="body">Описывает тип</text><rect x="358" y="375" width="294" height="208" rx="10" class="shared"/><text x="376" y="407" class="label">v: reflect.Value</text><text x="376" y="441" class="body">Type(): User</text><text x="376" y="471" class="body">Kind(): struct</text><text x="376" y="501" class="body">Поле Age: значение 30</text><text x="376" y="531" class="body">CanSet(): false</text><text x="28" y="630" class="small">t не хранит значение Age; v позволяет его прочитать.</text><text x="28" y="660" class="small">В самом User нет встроенного reflect.Value.</text></svg>
