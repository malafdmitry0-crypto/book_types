<svg xmlns="http://www.w3.org/2000/svg" width="600" height="538" viewBox="0 0 600 538" role="img" aria-labelledby="title desc"><title id="title">Рекурсия проходит через указатель</title><desc id="desc">У Node underlying type []Node. Срез хранит заголовок конечного размера; элементы находятся в отдельном массиве. После append(n, nil) в массиве один элемент — nil-срез типа Node.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="538" fill="#fff"/><text x="28" y="44" class="title">Рекурсия проходит через указатель</text><rect x="28" y="80" width="544" height="116" rx="10" class="value"/><text x="46" y="111" class="label">n: Node — заголовок среза</text><text x="46" y="145" class="body">указатель → массив элементов</text><text x="46" y="175" class="body">len = 1, cap ≥ 1</text><path d="M 300 196 V 238" class="arrow" marker-end="url(#tip)"/><text x="322" y="222" class="small">элемент [0]</text><rect x="28" y="252" width="544" height="116" rx="10" class="shared"/><text x="46" y="283" class="label">Массив: один элемент типа Node</text><text x="46" y="317" class="body">n[0]: nil-срез</text><text x="46" y="347" class="body">указатель = nil, len = 0, cap = 0</text><text x="28" y="424" class="small">В заголовок не встроен ещё один массив.</text><text x="28" y="453" class="small">Поэтому размер типа не растёт бесконечно.</text><text x="28" y="482" class="small">len(n) == 1; n[0] == nil: true.</text></svg>
