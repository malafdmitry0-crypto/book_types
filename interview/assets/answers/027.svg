<svg xmlns="http://www.w3.org/2000/svg" width="600" height="448" viewBox="0 0 600 448" role="img" aria-labelledby="title desc"><title id="title">Инверсия работает в текущей ширине</title><desc id="desc">Инверсия uint8 даёт восемь единиц. Инверсия после перехода к uint16 даёт шестнадцать. Расширение уже инвертированного uint8 добавляет нули.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="448" fill="#fff"/><text x="28" y="44" class="title">Инверсия работает в текущей ширине</text><rect x="28" y="80" width="544" height="94" rx="10" class="value"/><text x="46" y="111" class="label">^n: сначала инверсия 8 бит</text><text x="46" y="145" class="body">11111111 = 255</text><rect x="28" y="202" width="544" height="94" rx="10" class="shared"/><text x="46" y="233" class="label">^uint16(n): сначала расширение</text><text x="46" y="267" class="body">11111111 11111111 = 65535</text><rect x="28" y="324" width="544" height="94" rx="10" class="value"/><text x="46" y="355" class="label">uint16(^n): расширение после ^</text><text x="46" y="389" class="body">00000000 11111111 = 255</text></svg>
