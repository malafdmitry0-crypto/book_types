<svg xmlns="http://www.w3.org/2000/svg" width="600" height="498" viewBox="0 0 600 498" role="img" aria-labelledby="title desc"><title id="title">Что приходит слева при сдвиге</title><desc id="desc">У int8 сдвиг вправо повторяет знаковый бит 1. После uint8(a) те же исходные биты интерпретируются без знака, и слева добавляются нули.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="498" fill="#fff"/><text x="28" y="44" class="title">Что приходит слева при сдвиге</text><text x="28" y="95" class="label">a: int8 = −8</text><rect x="28" y="111" width="60" height="54" rx="5" class="value"/><text x="48" y="148" class="bit">1</text><rect x="94" y="111" width="60" height="54" rx="5" class="value"/><text x="114" y="148" class="bit">1</text><rect x="160" y="111" width="60" height="54" rx="5" class="value"/><text x="180" y="148" class="bit">1</text><rect x="226" y="111" width="60" height="54" rx="5" class="value"/><text x="246" y="148" class="bit">1</text><rect x="292" y="111" width="60" height="54" rx="5" class="value"/><text x="312" y="148" class="bit">1</text><rect x="358" y="111" width="60" height="54" rx="5" class="value"/><text x="378" y="148" class="bit">0</text><rect x="424" y="111" width="60" height="54" rx="5" class="value"/><text x="444" y="148" class="bit">0</text><rect x="490" y="111" width="60" height="54" rx="5" class="value"/><text x="510" y="148" class="bit">0</text><text x="28" y="248" class="label">a &gt;&gt; 2: слева 11 → −2</text><rect x="28" y="264" width="60" height="54" rx="5" class="shared"/><text x="48" y="301" class="bit">1</text><rect x="94" y="264" width="60" height="54" rx="5" class="shared"/><text x="114" y="301" class="bit">1</text><rect x="160" y="264" width="60" height="54" rx="5" class="shared"/><text x="180" y="301" class="bit">1</text><rect x="226" y="264" width="60" height="54" rx="5" class="shared"/><text x="246" y="301" class="bit">1</text><rect x="292" y="264" width="60" height="54" rx="5" class="shared"/><text x="312" y="301" class="bit">1</text><rect x="358" y="264" width="60" height="54" rx="5" class="shared"/><text x="378" y="301" class="bit">1</text><rect x="424" y="264" width="60" height="54" rx="5" class="shared"/><text x="444" y="301" class="bit">1</text><rect x="490" y="264" width="60" height="54" rx="5" class="shared"/><text x="510" y="301" class="bit">0</text><text x="28" y="401" class="label">uint8(a) &gt;&gt; 2: слева 00 → 62</text><rect x="28" y="417" width="60" height="54" rx="5" class="value"/><text x="48" y="454" class="bit">0</text><rect x="94" y="417" width="60" height="54" rx="5" class="value"/><text x="114" y="454" class="bit">0</text><rect x="160" y="417" width="60" height="54" rx="5" class="value"/><text x="180" y="454" class="bit">1</text><rect x="226" y="417" width="60" height="54" rx="5" class="value"/><text x="246" y="454" class="bit">1</text><rect x="292" y="417" width="60" height="54" rx="5" class="value"/><text x="312" y="454" class="bit">1</text><rect x="358" y="417" width="60" height="54" rx="5" class="value"/><text x="378" y="454" class="bit">1</text><rect x="424" y="417" width="60" height="54" rx="5" class="value"/><text x="444" y="454" class="bit">1</text><rect x="490" y="417" width="60" height="54" rx="5" class="value"/><text x="510" y="454" class="bit">0</text></svg>
