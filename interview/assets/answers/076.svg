<svg xmlns="http://www.w3.org/2000/svg" width="600" height="508" viewBox="0 0 600 508" role="img" aria-labelledby="title desc"><title id="title">Элемент можно упаковать, срез — нет</title><desc id="desc">[]int и []any — разные типы срезов с разными типами элементов. Для []any нужно отдельно создать элементы-интерфейсы и упаковать каждый int; запись []any(a) этого не делает.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="508" fill="#fff"/><text x="28" y="44" class="title">Элемент можно упаковать, срез — нет</text><rect x="28" y="80" width="544" height="88" rx="10" class="value"/><text x="46" y="111" class="label">Исходный a: []int</text><text x="46" y="145" class="body">элемент [0]: int(1)</text><rect x="28" y="200" width="544" height="70" rx="10" class="stop"/><text x="46" y="231" class="label">[]any(a) — ошибка компиляции</text><text x="28" y="319" class="label">Что потребовалось бы сделать явно:</text><rect x="28" y="344" width="544" height="116" rx="10" class="shared"/><text x="46" y="375" class="label">Новый срез []any</text><text x="46" y="409" class="body">элемент [0]: (тип int, значение 1)</text><text x="46" y="439" class="body">Для каждого элемента — своя упаковка</text></svg>
