<svg xmlns="http://www.w3.org/2000/svg" width="600" height="484" viewBox="0 0 600 484" role="img" aria-labelledby="title desc"><title id="title">Важен момент расширения</title><desc id="desc">В uint16(a+b) сумма сначала вычисляется в uint8: 300 по модулю 256 даёт 44. Во втором выражении оба слагаемых уже uint16 и 300 помещается.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="484" fill="#fff"/><text x="28" y="44" class="title">Важен момент расширения</text><rect x="28" y="80" width="544" height="94" rx="10" class="value"/><text x="46" y="111" class="label">a: uint8(200), b: uint8(100)</text><text x="46" y="145" class="body">Математическая сумма: 300</text><path d="M 300 174 V 205 H 154 V 242" class="arrow" marker-end="url(#tip)"/><path d="M 300 205 H 446 V 242" class="arrow" marker-end="url(#tip)"/><rect x="28" y="254" width="252" height="94" rx="10" class="stop"/><text x="46" y="285" class="label">a + b в uint8</text><text x="46" y="319" class="body">300 → 44</text><rect x="320" y="254" width="252" height="94" rx="10" class="shared"/><text x="338" y="285" class="label">uint16(a) +</text><text x="338" y="319" class="body">uint16(b) = 300</text><path d="M 154 348 V 383" class="arrow" marker-end="url(#tip)"/><rect x="28" y="395" width="252" height="64" rx="10" class="value"/><text x="46" y="426" class="label">uint16(44) = 44</text></svg>
