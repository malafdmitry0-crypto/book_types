<svg xmlns="http://www.w3.org/2000/svg" width="600" height="538" viewBox="0 0 600 538" role="img" aria-labelledby="title desc"><title id="title">Промежуточный тип меняет результат</title><desc id="desc">При прямом переходе int8(−1) к uint16 знак расширяется перед усечением до 16 бит. Через uint8 промежуточное значение уже равно положительным 255.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="538" fill="#fff"/><text x="28" y="44" class="title">Промежуточный тип меняет результат</text><rect x="28" y="80" width="544" height="94" rx="10" class="value"/><text x="46" y="111" class="label">n: int8 = −1</text><text x="46" y="145" class="body">11111111</text><text x="28" y="219" class="label">Прямо в uint16</text><path d="M 300 230 V 258" class="arrow" marker-end="url(#tip)"/><rect x="28" y="270" width="544" height="88" rx="10" class="value"/><text x="46" y="301" class="label">11111111 11111111</text><text x="46" y="335" class="body">uint16(n) = 65535</text><text x="28" y="406" class="label">Через uint8: 11111111 = 255</text><rect x="28" y="432" width="544" height="82" rx="10" class="shared"/><text x="46" y="463" class="label">00000000 11111111</text><text x="46" y="497" class="body">uint16(uint8(n)) = 255</text></svg>
