<svg xmlns="http://www.w3.org/2000/svg" width="600" height="452" viewBox="0 0 600 452" role="img" aria-labelledby="title desc"><title id="title">nil-срез тоже имеет конкретный тип</title><desc id="desc">В a есть динамический тип []int и значение nil-среза. Сравнение a == nil проверяет пустоту интерфейса, а не элементы среза: результат false, паники нет.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="452" fill="#fff"/><text x="28" y="44" class="title">nil-срез тоже имеет конкретный тип</text><rect x="28" y="80" width="544" height="94" rx="10" class="empty"/><text x="46" y="111" class="label">s: []int = nil</text><text x="46" y="145" class="body">указатель = nil, len = 0, cap = 0</text><path d="M 300 174 V 216" class="arrow" marker-end="url(#tip)"/><text x="322" y="200" class="small">var a any = s</text><rect x="28" y="230" width="544" height="112" rx="10" class="shared"/><text x="46" y="261" class="label">a: any</text><text x="46" y="295" class="body">динамический тип: []int</text><text x="46" y="325" class="body">значение: nil-срез</text><text x="28" y="391" class="small">a == nil → false: тип []int присутствует.</text><text x="28" y="420" class="small">Элементы среза здесь не сравниваются.</text></svg>
