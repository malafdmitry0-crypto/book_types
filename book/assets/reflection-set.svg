<svg xmlns="http://www.w3.org/2000/svg" width="680" height="666" viewBox="0 0 680 666" role="img" aria-labelledby="title desc"><title id="title">Копия или исходная переменная</title><desc id="desc">Для изменения исходного u передаём &amp;u, разыменовываем через Elem и выбираем поле Age.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:22px}.small{font-size:20px;fill:#52657c}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}</style><rect width="680" height="666" fill="white"/><text x="28" y="44" class="title">Копия или исходная переменная</text><rect x="28" y="90" width="294" height="122" rx="10" class="value"/><text x="46" y="122" class="label">ValueOf(u)</text><text x="46" y="156" class="body">Передана копия</text><text x="46" y="186" class="body">CanSet(): false</text><rect x="358" y="90" width="294" height="122" rx="10" class="shared"/><text x="376" y="122" class="label">ValueOf(&amp;u)</text><text x="376" y="156" class="body">Тип: *User</text><text x="376" y="186" class="body">Значение: адрес u</text><path d="M 505 212 V 266" class="arrow" marker-end="url(#tip)"/><text x="520" y="249" class="small">Elem()</text><rect x="358" y="278" width="294" height="112" rx="10" class="shared"/><text x="376" y="310" class="label">Исходный u</text><text x="376" y="344" class="body">Тип: User</text><text x="376" y="374" class="body">CanSet(): true</text><path d="M 505 390 V 444" class="arrow" marker-end="url(#tip)"/><text x="300" y="428" class="small">FieldByName("Age")</text><rect x="358" y="456" width="294" height="112" rx="10" class="shared"/><text x="376" y="488" class="label">Поле u.Age</text><text x="376" y="522" class="body">30 → 31</text><text x="376" y="552" class="body">SetInt(31)</text><rect x="28" y="278" width="294" height="112" rx="10" class="value"/><text x="46" y="310" class="label">Поле копии: Age</text><text x="46" y="344" class="body">Значение: 30</text><text x="46" y="374" class="body">CanSet(): false</text><text x="28" y="610" class="small">После записи u.Age равен 31.</text><text x="28" y="640" class="small">Копия, переданная через ValueOf(u), осталась с Age = 30.</text></svg>
