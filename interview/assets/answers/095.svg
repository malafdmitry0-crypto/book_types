<svg xmlns="http://www.w3.org/2000/svg" width="600" height="408" viewBox="0 0 600 408" role="img" aria-labelledby="title desc"><title id="title">В интерфейсе — копия структуры</title><desc id="desc">a содержит скопированное S{X:1}. Последующая запись s.X = 2 меняет исходную структуру, а не её копию в интерфейсе. Поэтому вывод — 1 2.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="408" fill="#fff"/><text x="28" y="44" class="title">В интерфейсе — копия структуры</text><rect x="28" y="80" width="252" height="112" rx="10" class="value"/><text x="46" y="111" class="label">Исходный s: S</text><text x="46" y="145" class="body">X = 1</text><path d="M 280 132 H 308" class="arrow" marker-end="url(#tip)"/><rect x="320" y="80" width="252" height="112" rx="10" class="value"/><text x="338" y="111" class="label">a: any</text><text x="338" y="145" class="body">тип: S</text><text x="338" y="175" class="body">значение: S{1}</text><path d="M 154 192 V 241" class="arrow" marker-end="url(#tip)"/><text x="174" y="224" class="small">s.X = 2</text><rect x="28" y="253" width="252" height="100" rx="10" class="shared"/><text x="46" y="284" class="label">s.X = 2</text><text x="46" y="318" class="body">изменён оригинал</text><rect x="320" y="253" width="252" height="100" rx="10" class="value"/><text x="338" y="284" class="label">a.(S).X = 1</text><text x="338" y="318" class="body">копия прежняя</text><text x="28" y="389" class="small">Стрелка сверху — копирование при присваивании.</text></svg>
