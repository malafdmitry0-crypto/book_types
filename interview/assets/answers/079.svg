<svg xmlns="http://www.w3.org/2000/svg" width="600" height="446" viewBox="0 0 600 446" role="img" aria-labelledby="title desc"><title id="title">Одно имя, две переменные</title><desc id="desc">Внутреннее x := &quot;one&quot; создаёт новую переменную и временно скрывает внешнее x. После выхода из блока имя x снова обозначает int-переменную со значением 1.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="446" fill="#fff"/><text x="28" y="44" class="title">Одно имя, две переменные</text><rect x="28" y="80" width="544" height="330" rx="12" class="value"/><text x="46" y="115" class="label">Внешний блок: x — int(1)</text><rect x="62" y="150" width="476" height="116" rx="10" class="shared"/><text x="80" y="181" class="label">Вложенный блок</text><text x="80" y="215" class="body">x — string(&quot;one&quot;)</text><text x="80" y="245" class="body">%T внутри печатает string</text><path d="M 300 266 V 314" class="arrow" marker-end="url(#tip)"/><text x="320" y="297" class="small">выход из блока</text><text x="46" y="358" class="body">%T снаружи снова печатает int</text><text x="46" y="390" class="small">Внешнее значение не менялось.</text></svg>
