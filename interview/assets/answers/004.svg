<svg xmlns="http://www.w3.org/2000/svg" width="600" height="486" viewBox="0 0 600 486" role="img" aria-labelledby="title desc"><title id="title">До интерфейса дело не доходит</title><desc id="desc">Для var x any = n сначала нужен конкретный тип n. Выбирается int, но 2¹⁰⁰ в него не помещается: ошибка возникает до упаковки.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="486" fill="#fff"/><text x="28" y="44" class="title">До интерфейса дело не доходит</text><rect x="28" y="78" width="544" height="104" rx="10" class="value"/><text x="46" y="109" class="label">const n = 1 &lt;&lt; 100</text><text x="46" y="143" class="body">Нетипизированная константа: 2¹⁰⁰</text><path d="M 300 182 V 224" class="arrow" marker-end="url(#tip)"/><text x="322" y="208" class="small">присваивание в any</text><rect x="28" y="232" width="544" height="104" rx="10" class="stop"/><text x="46" y="263" class="label">Тип по умолчанию — int</text><text x="46" y="297" class="body">2¹⁰⁰ не помещается в 32 или 64 бита</text><text x="28" y="388" class="small">Компиляция останавливается здесь.</text><text x="28" y="417" class="small">Переменная x не получает значение.</text><text x="28" y="446" class="small">any не превращает число в big.Int.</text></svg>
