<svg xmlns="http://www.w3.org/2000/svg" width="600" height="438" viewBox="0 0 600 438" role="img" aria-labelledby="title desc"><title id="title">nil в указателе и nil в интерфейсе</title><desc id="desc">p равен nil. При присваивании в error появляется динамический тип *E, поэтому e не равен nil: nil-указатель является его значением.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="438" fill="#fff"/><text x="28" y="44" class="title">nil в указателе и nil в интерфейсе</text><rect x="28" y="80" width="544" height="84" rx="10" class="empty"/><text x="46" y="111" class="label">p: *E</text><text x="46" y="145" class="body">значение: nil</text><path d="M 300 164 V 206" class="arrow" marker-end="url(#tip)"/><text x="322" y="190" class="small">var e error = p</text><rect x="28" y="220" width="544" height="112" rx="10" class="shared"/><text x="46" y="251" class="label">e: error</text><text x="46" y="285" class="body">динамический тип: *E</text><text x="46" y="315" class="body">динамическое значение: nil</text><text x="28" y="378" class="small">p == nil → true</text><text x="28" y="407" class="small">e == nil → false: динамический тип есть.</text></svg>
