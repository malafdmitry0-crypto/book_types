<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">Между соседними float32 есть пробел</title><desc id="desc">В этом диапазоне соседние float32 — 16777216 и 16777218. Число 16777217 ровно посередине; округление к ближайшему с чётной мантиссой выбирает 16777216.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="420" fill="#fff"/><text x="28" y="44" class="title">Между соседними float32 есть пробел</text><text x="28" y="102" class="label">a + 1 = 16777217</text><text x="28" y="138" class="small">Точное значение перед округлением</text><path d="M 65 222 H 535 M 65 208 V 236 M 300 208 V 236 M 535 208 V 236" class="line"/><circle cx="65" cy="222" r="8" fill="#185bc7"/><circle cx="535" cy="222" r="8" fill="#185bc7"/><circle cx="300" cy="222" r="8" fill="#ab4c21"/><text x="28" y="269" class="small">16777216</text><text x="425" y="269" class="small">16777218</text><path d="M 296 210 Q 180 180 70 210" class="arrow" marker-end="url(#tip)"/><text x="120" y="179" class="small">округление</text><rect x="28" y="305" width="544" height="84" rx="10" class="shared"/><text x="46" y="336" class="label">a и b → 16777216</text><text x="46" y="370" class="body">Поэтому a == b: true</text></svg>
