<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">Assertion сравнивает типы</title><desc id="desc">В a хранится int32(7). Проверка a.(int64) не выполняет int64(7): типы не совпадают, поэтому comma-ok форма возвращает ноль int64 и false.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="440" fill="#fff"/><text x="28" y="44" class="title">Assertion сравнивает типы</text><rect x="28" y="80" width="544" height="100" rx="10" class="value"/><text x="46" y="111" class="label">a: any</text><text x="46" y="145" class="body">(динамический тип int32, значение 7)</text><path d="M 300 180 V 222" class="arrow" marker-end="url(#tip)"/><text x="322" y="206" class="small">a.(int64)</text><rect x="28" y="236" width="544" height="84" rx="10" class="stop"/><text x="46" y="267" class="label">int32 == int64 ?</text><text x="46" y="301" class="body">Нет: типы разные</text><text x="28" y="372" class="small">n получает нулевое значение int64: 0.</text><text x="28" y="401" class="small">ok получает false. Конверсия не выполнялась.</text></svg>
