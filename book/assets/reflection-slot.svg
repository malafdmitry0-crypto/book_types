<svg xmlns="http://www.w3.org/2000/svg" width="680" height="706" viewBox="0 0 680 706" role="img" aria-labelledby="title desc"><title id="title">Сам интерфейс или значение внутри</title><desc id="desc">var x any = int32(42). Разные пути отражают разные уровни.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:22px}.small{font-size:20px;fill:#52657c}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}</style><rect width="680" height="706" fill="white"/><text x="28" y="44" class="title">Сам интерфейс или значение внутри</text><text x="28" y="86" class="small">var x any = int32(42)</text><rect x="28" y="118" width="294" height="142" rx="10" class="value"/><text x="46" y="150" class="label">ValueOf(x)</text><text x="46" y="184" class="body">Type(): int32</text><text x="46" y="214" class="body">Значение: 42</text><text x="46" y="244" class="body">CanSet(): false</text><rect x="358" y="118" width="294" height="142" rx="10" class="shared"/><text x="376" y="150" class="label">ValueOf(&amp;x).Elem()</text><text x="376" y="184" class="body">slot: переменная x</text><text x="376" y="214" class="body">Kind(): interface</text><text x="376" y="244" class="body">CanSet(): true</text><path d="M 505 260 V 314" class="arrow" marker-end="url(#tip)"/><text x="520" y="296" class="small">slot.Elem()</text><rect x="358" y="326" width="294" height="142" rx="10" class="value"/><text x="376" y="358" class="label">Содержимое x</text><text x="376" y="392" class="body">inside.Type(): int32</text><text x="376" y="422" class="body">Значение: 42</text><text x="376" y="452" class="body">CanSet(): false</text><rect x="28" y="510" width="624" height="142" rx="10" class="shared"/><text x="46" y="542" class="label">slot.Set(reflect.ValueOf("hello"))</text><text x="46" y="576" class="body">Заменяет содержимое исходного x:</text><text x="46" y="606" class="body">(int32, 42) → (string, "hello")</text><text x="46" y="636" class="body">Статический тип x остаётся any.</text><text x="28" y="684" class="small">Set меняет переменную-интерфейс, а не число 42.</text></svg>
