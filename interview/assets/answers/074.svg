<svg xmlns="http://www.w3.org/2000/svg" width="600" height="438" viewBox="0 0 600 438" role="img" aria-labelledby="title desc"><title id="title">Присваивание map не копирует записи</title><desc id="desc">a типа M и b типа map[string]int обращаются к одной карте. Запись по ключу через b видна при чтении через a.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="438" fill="#fff"/><text x="28" y="44" class="title">Присваивание map не копирует записи</text><rect x="28" y="80" width="252" height="116" rx="10" class="value"/><text x="46" y="111" class="label">a: M</text><text x="46" y="145" class="body">доступ к карте</text><rect x="320" y="80" width="252" height="116" rx="10" class="value"/><text x="338" y="111" class="label">b: map[string]int</text><text x="338" y="145" class="body">та же карта</text><path d="M 154 196 V 230 H 240 V 270" class="arrow" marker-end="url(#tip)"/><path d="M 446 196 V 230 H 360 V 270" class="arrow" marker-end="url(#tip)"/><rect x="100" y="282" width="400" height="98" rx="10" class="shared"/><text x="118" y="313" class="label">Общая карта</text><text x="118" y="347" class="body">ключ &quot;x&quot;: 1 → 2</text><text x="28" y="416" class="small">a[&quot;x&quot;] читает обновлённое значение 2.</text></svg>
