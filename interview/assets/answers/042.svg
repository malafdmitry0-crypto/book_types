<svg xmlns="http://www.w3.org/2000/svg" width="600" height="432" viewBox="0 0 600 432" role="img" aria-labelledby="title desc"><title id="title">Новый тип не наследует методы</title><desc id="desc">type B A создаёт отдельный тип B с underlying type int. Метод Double объявлен у A; общей основы int недостаточно, чтобы он появился у B. Алиас type B = A дал бы другой результат.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="432" fill="#fff"/><text x="28" y="44" class="title">Новый тип не наследует методы</text><rect x="28" y="80" width="252" height="112" rx="10" class="value"/><text x="46" y="111" class="label">A</text><text x="46" y="145" class="body">Метод Double()</text><text x="46" y="175" class="body">объявлен здесь</text><rect x="320" y="80" width="252" height="112" rx="10" class="stop"/><text x="338" y="111" class="label">B</text><text x="338" y="145" class="body">Метода Double()</text><text x="338" y="175" class="body">нет</text><path d="M 154 192 V 232 H 250 V 266" class="arrow" marker-end="url(#tip)"/><path d="M 446 192 V 232 H 350 V 266" class="arrow" marker-end="url(#tip)"/><rect x="155" y="278" width="290" height="66" rx="10" class="empty"/><text x="173" y="309" class="label">underlying type: int</text><text x="28" y="392" class="small">Общее представление ≠ общий набор методов.</text></svg>
