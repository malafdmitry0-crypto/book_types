<svg xmlns="http://www.w3.org/2000/svg" width="600" height="466" viewBox="0 0 600 466" role="img" aria-labelledby="title desc"><title id="title">Проверяется конкретный T</title><desc id="desc">Статический интерфейс R предоставляет только Read. Assertion к W проверяет динамический T, у которого есть и Write; поэтому проверка успешна.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="466" fill="#fff"/><text x="28" y="44" class="title">Проверяется конкретный T</text><rect x="28" y="80" width="544" height="86" rx="10" class="value"/><text x="46" y="111" class="label">r: R</text><text x="46" y="145" class="body">Через r доступен только Read()</text><path d="M 300 166 V 208" class="arrow" marker-end="url(#tip)"/><text x="322" y="192" class="small">динамический тип</text><rect x="28" y="222" width="544" height="110" rx="10" class="shared"/><text x="46" y="253" class="label">T</text><text x="46" y="287" class="body">Read()   ✓</text><text x="46" y="317" class="body">Write()  ✓</text><path d="M 300 332 V 368" class="arrow" marker-end="url(#tip)"/><rect x="28" y="380" width="544" height="62" rx="10" class="value"/><text x="46" y="411" class="label">r.(W): у T есть Write() → ok = true</text></svg>
