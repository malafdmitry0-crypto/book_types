<svg xmlns="http://www.w3.org/2000/svg" width="680" height="455" viewBox="0 0 680 455" role="img" aria-labelledby="title desc"><title id="title">Одинаковый интерфейс, разное содержимое</title><desc id="desc">После упаковки выполняем c.N = 99.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:25px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#52657c}.mono{font-family:Consolas,monospace;font-size:21px;font-weight:700}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.pointer{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.rule{stroke:#dbe3ef;stroke-width:1.5}</style><rect width="680" height="455" fill="#fff"/><text x="28" y="42" class="title">Одинаковый интерфейс, разное содержимое</text><text x="28" y="73" class="small">После упаковки выполняем c.N = 99.</text><rect x="28" y="112" width="258" height="106" rx="10" class="value"/><text x="46" y="142" class="mono">a: any</text><text x="46" y="172" class="body">тип: Counter</text><rect x="395" y="112" width="257" height="106" rx="10" class="value"/><text x="413" y="142" class="mono">копия Counter</text><text x="413" y="172" class="body">N = 10</text><path d="M 286 165 H 383" class="arrow" marker-end="url(#tip)"/><text x="297" y="146" class="small">значение</text><rect x="28" y="275" width="258" height="106" rx="10" class="pointer"/><text x="46" y="305" class="mono">b: any</text><text x="46" y="335" class="body">тип: *Counter</text><rect x="395" y="275" width="257" height="106" rx="10" class="pointer"/><text x="413" y="305" class="mono">исходный c</text><text x="413" y="335" class="body">N = 99</text><path d="M 286 328 H 383" class="arrow" marker-end="url(#tip)"/><text x="310" y="309" class="small">адрес</text><text x="28" y="425" class="small">Присваивание структуры в интерфейс не превращает её в ссылку.</text></svg>
