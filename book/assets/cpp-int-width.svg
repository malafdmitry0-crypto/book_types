<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img" aria-labelledby="title desc"><title id="title">int: размер известен при сборке</title><desc id="desc">Один квадрат — один байт. Значение переменной не меняет её размер.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:25px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#52657c}.mono{font-family:Consolas,monospace;font-size:21px;font-weight:700}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.pointer{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.rule{stroke:#dbe3ef;stroke-width:1.5}</style><rect width="680" height="460" fill="#fff"/><text x="28" y="42" class="title">int: размер известен при сборке</text><text x="28" y="73" class="small">Один квадрат — один байт. Значение переменной не меняет её размер.</text><rect x="28" y="101" width="624" height="66" rx="10" class="value"/><text x="46" y="131" class="mono">var x int = 42</text><text x="28" y="207" class="mono">GOARCH=386</text><rect x="285" y="180" width="36" height="42" rx="4" class="value"/><text x="294" y="207" class="small">1</text><rect x="327" y="180" width="36" height="42" rx="4" class="value"/><text x="336" y="207" class="small">1</text><rect x="369" y="180" width="36" height="42" rx="4" class="value"/><text x="378" y="207" class="small">1</text><rect x="411" y="180" width="36" height="42" rx="4" class="value"/><text x="420" y="207" class="small">1</text><text x="285" y="250" class="body">4 байта · 32 бита</text><text x="28" y="303" class="mono">amd64 / arm64</text><rect x="285" y="276" width="36" height="42" rx="4" class="value"/><text x="294" y="303" class="small">1</text><rect x="327" y="276" width="36" height="42" rx="4" class="value"/><text x="336" y="303" class="small">1</text><rect x="369" y="276" width="36" height="42" rx="4" class="value"/><text x="378" y="303" class="small">1</text><rect x="411" y="276" width="36" height="42" rx="4" class="value"/><text x="420" y="303" class="small">1</text><rect x="453" y="276" width="36" height="42" rx="4" class="value"/><text x="462" y="303" class="small">1</text><rect x="495" y="276" width="36" height="42" rx="4" class="value"/><text x="504" y="303" class="small">1</text><rect x="537" y="276" width="36" height="42" rx="4" class="value"/><text x="546" y="303" class="small">1</text><rect x="579" y="276" width="36" height="42" rx="4" class="value"/><text x="588" y="303" class="small">1</text><text x="285" y="346" class="body">8 байт · 64 бита</text><text x="28" y="405" class="body">int и int64 остаются разными типами,</text><text x="28" y="432" class="body">даже когда занимают одинаковое число байтов.</text></svg>
