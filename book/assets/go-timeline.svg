<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="3154" viewBox="0 0 1200 3154" role="img" aria-labelledby="title desc"><title id="title">Как Go учился обобщать алгоритмы</title><desc id="desc">Ключевые вехи системы типов и стандартной библиотеки: 2009–2026. Расстояния между событиями условные.</desc><rect width="1200" height="3154" fill="#f7f9fc"/><g font-family="Arial, sans-serif"><text x="48" y="58" font-size="34" fill="#192c44" font-weight="700">Go / От интерфейсов к параметрам типов</text><text x="48" y="94" font-size="18" fill="#192c44" font-weight="400">2009–2026 · Ключевые вехи по теме учебника · Шкала времени неравномерная</text><circle cx="56" cy="130" r="5" fill="#7636a3"/><text x="70" y="136" font-size="17" fill="#7636a3" font-weight="400">Язык</text><circle cx="286" cy="130" r="5" fill="#006775"/><text x="300" y="136" font-size="17" fill="#006775" font-weight="400">Библиотека</text><circle cx="516" cy="130" r="5" fill="#9a4017"/><text x="530" y="136" font-size="17" fill="#9a4017" font-weight="400">Инструменты</text><path d="M 234 194 V 3058" stroke="#dbe3ef" stroke-width="3"/><circle cx="234" cy="200" r="7" fill="#7636a3"/><text x="48" y="206" font-size="17" fill="#192c44" font-weight="400">2009</text><a href="https://go.dev/talks/2009/go_talk-20091030.pdf"><rect x="260" y="170" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="199" font-size="18" fill="#7636a3" font-weight="700">Публичный Go  /  Язык</text><text x="282" y="230" font-size="23" fill="#192c44" font-weight="700">Общие алгоритмы через поведение</text><text x="282" y="261" font-size="18" fill="#192c44" font-weight="400">Интерфейсы, interface{}, проверки типов и reflection уже в раннем Go. Адаптер связывает</text><text x="282" y="285" font-size="18" fill="#192c44" font-weight="400">конкретные данные с контрактом алгоритма.</text></a><circle cx="234" cy="372" r="7" fill="#006775"/><text x="48" y="378" font-size="17" fill="#192c44" font-weight="400">2012</text><a href="https://go.dev/doc/go1"><rect x="260" y="342" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="371" font-size="18" fill="#006775" font-weight="700">Go 1  /  Библиотека</text><text x="282" y="402" font-size="23" fill="#192c44" font-weight="700">Стабильная точка отсчёта</text><text x="282" y="433" font-size="18" fill="#192c44" font-weight="400">sort.Interface: Len, Less, Swap. Алгоритм сортировки работает с индексами, не зная типа</text><text x="282" y="457" font-size="18" fill="#192c44" font-weight="400">элементов. Эти идеи появились до Go 1.</text></a><circle cx="234" cy="544" r="7" fill="#9a4017"/><text x="48" y="550" font-size="17" fill="#192c44" font-weight="400">2014</text><a href="https://go.dev/doc/go1.4"><rect x="260" y="514" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="543" font-size="18" fill="#9a4017" font-weight="700">Go 1.4  /  Инструменты</text><text x="282" y="574" font-size="23" fill="#192c44" font-weight="700">Автоматизация генерации</text><text x="282" y="605" font-size="18" fill="#192c44" font-weight="400">go generate запускает генераторы. Можно получать отдельные типизированные реализации из</text><text x="282" y="629" font-size="18" fill="#192c44" font-weight="400">шаблона; сама идея генерации старше этой команды.</text></a><circle cx="234" cy="716" r="7" fill="#006775"/><text x="48" y="722" font-size="17" fill="#192c44" font-weight="400">2017 · февраль</text><a href="https://go.dev/doc/go1.8"><rect x="260" y="686" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="715" font-size="18" fill="#006775" font-weight="700">Go 1.8  /  Библиотека</text><text x="282" y="746" font-size="23" fill="#192c44" font-weight="700">Меньше адаптерного кода</text><text x="282" y="777" font-size="18" fill="#192c44" font-weight="400">sort.Slice принимает срез и функцию сравнения. В языке конверсии структур теперь</text><text x="282" y="801" font-size="18" fill="#192c44" font-weight="400">допускают различающиеся теги.</text></a><circle cx="234" cy="888" r="7" fill="#7636a3"/><text x="48" y="894" font-size="17" fill="#192c44" font-weight="400">2017 · август</text><a href="https://go.dev/doc/go1.9"><rect x="260" y="858" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="887" font-size="18" fill="#7636a3" font-weight="700">Go 1.9  /  Язык</text><text x="282" y="918" font-size="23" fill="#192c44" font-weight="700">Другое имя того же типа</text><text x="282" y="949" font-size="18" fill="#192c44" font-weight="400">type A = B вводит алиас. Он помогает переносить API между пакетами, но не создаёт новый</text><text x="282" y="973" font-size="18" fill="#192c44" font-weight="400">тип и не обобщает алгоритм.</text></a><circle cx="234" cy="1060" r="7" fill="#006775"/><text x="48" y="1066" font-size="17" fill="#192c44" font-weight="400">2019</text><a href="https://go.dev/doc/go1.13"><rect x="260" y="1030" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="1059" font-size="18" fill="#006775" font-weight="700">Go 1.13  /  Библиотека</text><text x="282" y="1090" font-size="23" fill="#192c44" font-weight="700">Поиск типа в цепочке ошибок</text><text x="282" y="1121" font-size="18" fill="#192c44" font-weight="400">errors.As находит подходящую ошибку через обёртки. Это библиотечный поиск с правилами</text><text x="282" y="1145" font-size="18" fill="#192c44" font-weight="400">сопоставления, а не новая конверсия языка.</text></a><circle cx="234" cy="1232" r="7" fill="#7636a3"/><text x="48" y="1238" font-size="17" fill="#192c44" font-weight="400">2020</text><a href="https://go.dev/doc/go1.14"><rect x="260" y="1202" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="1231" font-size="18" fill="#7636a3" font-weight="700">Go 1.14  /  Язык</text><text x="282" y="1262" font-size="23" fill="#192c44" font-weight="700">Композиция интерфейсов</text><text x="282" y="1293" font-size="18" fill="#192c44" font-weight="400">Встроенные интерфейсы могут повторять методы с одинаковыми сигнатурами. Несовместимые</text><text x="282" y="1317" font-size="18" fill="#192c44" font-weight="400">сигнатуры по-прежнему запрещены.</text></a><circle cx="234" cy="1404" r="7" fill="#7636a3"/><text x="48" y="1410" font-size="17" fill="#192c44" font-weight="400">2021</text><a href="https://go.dev/doc/go1.17"><rect x="260" y="1374" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="1403" font-size="18" fill="#7636a3" font-weight="700">Go 1.17  /  Язык</text><text x="282" y="1434" font-size="23" fill="#192c44" font-weight="700">Новые переходы между представлениями</text><text x="282" y="1465" font-size="18" fill="#192c44" font-weight="400">[]T → *[N]T; reflect.Value.CanConvert; unsafe.Add и unsafe.Slice. Они расширяют работу с</text><text x="282" y="1489" font-size="18" fill="#192c44" font-weight="400">типами, но ещё не дают параметров типов.</text></a><circle cx="234" cy="1576" r="7" fill="#7636a3"/><text x="48" y="1582" font-size="17" fill="#192c44" font-weight="400">2022</text><a href="https://go.dev/doc/go1.18"><rect x="260" y="1546" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="1575" font-size="18" fill="#7636a3" font-weight="700">Go 1.18  /  Язык</text><text x="282" y="1606" font-size="23" fill="#192c44" font-weight="700">Параметры типов</text><text x="282" y="1637" font-size="18" fill="#192c44" font-weight="400">Дженерики, type sets, ~, any и comparable. Общая функция сохраняет тип элемента; any —</text><text x="282" y="1661" font-size="18" fill="#192c44" font-weight="400">лишь алиас interface{}.</text></a><circle cx="234" cy="1748" r="7" fill="#7636a3"/><text x="48" y="1754" font-size="17" fill="#192c44" font-weight="400">2023 · февраль</text><a href="https://go.dev/doc/go1.20"><rect x="260" y="1718" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="1747" font-size="18" fill="#7636a3" font-weight="700">Go 1.20  /  Язык</text><text x="282" y="1778" font-size="23" fill="#192c44" font-weight="700">Уточнение правил дженериков</text><text x="282" y="1809" font-size="18" fill="#192c44" font-weight="400">Обычные интерфейсные типы могут удовлетворять comparable; сравнение всё ещё способно</text><text x="282" y="1833" font-size="18" fill="#192c44" font-weight="400">паниковать. Добавлена конверсия []T → [N]T.</text></a><circle cx="234" cy="1920" r="7" fill="#006775"/><text x="48" y="1926" font-size="17" fill="#192c44" font-weight="400">2023 · август</text><a href="https://go.dev/doc/go1.21"><rect x="260" y="1890" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="1919" font-size="18" fill="#006775" font-weight="700">Go 1.21  /  Библиотека</text><text x="282" y="1950" font-size="23" fill="#192c44" font-weight="700">Общие алгоритмы в стандартной библиотеке</text><text x="282" y="1981" font-size="18" fill="#192c44" font-weight="400">Пакеты slices, maps и cmp; встроенные min, max, clear. Расширен вывод типов. Параметры</text><text x="282" y="2005" font-size="18" fill="#192c44" font-weight="400">типов становятся основой готовых API коллекций.</text></a><circle cx="234" cy="2092" r="7" fill="#006775"/><text x="48" y="2098" font-size="17" fill="#192c44" font-weight="400">2024 · февраль</text><a href="https://go.dev/doc/go1.22"><rect x="260" y="2062" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="2091" font-size="18" fill="#006775" font-weight="700">Go 1.22  /  Библиотека</text><text x="282" y="2122" font-size="23" fill="#192c44" font-weight="700">Мост от дженериков к reflection</text><text x="282" y="2153" font-size="18" fill="#192c44" font-weight="400">reflect.TypeFor[T]() получает reflect.Type по параметру типа, без значения-образца.</text><text x="282" y="2177" font-size="18" fill="#192c44" font-weight="400">Механизмы дополняют друг друга.</text></a><circle cx="234" cy="2264" r="7" fill="#7636a3"/><text x="48" y="2270" font-size="17" fill="#192c44" font-weight="400">2024 · август</text><a href="https://go.dev/doc/go1.23"><rect x="260" y="2234" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="2263" font-size="18" fill="#7636a3" font-weight="700">Go 1.23  /  Язык</text><text x="282" y="2294" font-size="23" fill="#192c44" font-weight="700">Общий протокол обхода</text><text x="282" y="2325" font-size="18" fill="#192c44" font-weight="400">range по функциям-итераторам, пакет iter, итераторы slices и maps. slices.All выдаёт</text><text x="282" y="2349" font-size="18" fill="#192c44" font-weight="400">индексы и значения, а не проверяет предикат «все».</text></a><circle cx="234" cy="2436" r="7" fill="#7636a3"/><text x="48" y="2442" font-size="17" fill="#192c44" font-weight="400">2025 · февраль</text><a href="https://go.dev/doc/go1.24"><rect x="260" y="2406" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="2435" font-size="18" fill="#7636a3" font-weight="700">Go 1.24  /  Язык</text><text x="282" y="2466" font-size="23" fill="#192c44" font-weight="700">Алиасы с параметрами типов</text><text x="282" y="2497" font-size="18" fill="#192c44" font-weight="400">Полная поддержка generic aliases, включая использование между пакетами. В Go 1.23</text><text x="282" y="2521" font-size="18" fill="#192c44" font-weight="400">поддержка была экспериментальной и ограниченной.</text></a><circle cx="234" cy="2608" r="7" fill="#7636a3"/><text x="48" y="2614" font-size="17" fill="#192c44" font-weight="400">2025 · август</text><a href="https://go.dev/doc/go1.25"><rect x="260" y="2578" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="2607" font-size="18" fill="#7636a3" font-weight="700">Go 1.25  /  Язык</text><text x="282" y="2638" font-size="23" fill="#192c44" font-weight="700">Проще описание системы типов</text><text x="282" y="2669" font-size="18" fill="#192c44" font-weight="400">Из спецификации убрано понятие core types. Это упрощение правил изложения, без изменения</text><text x="282" y="2693" font-size="18" fill="#192c44" font-weight="400">поведения программ.</text></a><circle cx="234" cy="2780" r="7" fill="#7636a3"/><text x="48" y="2786" font-size="17" fill="#192c44" font-weight="400">2026 · февраль</text><a href="https://go.dev/doc/go1.26"><rect x="260" y="2750" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="2779" font-size="18" fill="#7636a3" font-weight="700">Go 1.26  /  Язык</text><text x="282" y="2810" font-size="23" fill="#192c44" font-weight="700">Самоссылки в ограничениях</text><text x="282" y="2841" font-size="18" fill="#192c44" font-weight="400">Generic-тип может ссылаться на себя в списке параметров типов. Это расширяет способы</text><text x="282" y="2865" font-size="18" fill="#192c44" font-weight="400">записи контрактов операций над собственным типом.</text></a><circle cx="234" cy="2952" r="7" fill="#7636a3"/><text x="48" y="2958" font-size="17" fill="#192c44" font-weight="400">2026 · август</text><a href="https://go.dev/doc/go1.27"><rect x="260" y="2922" width="892" height="156" rx="12" fill="white" stroke="#dbe3ef"/><text x="282" y="2951" font-size="18" fill="#7636a3" font-weight="700">Go 1.27  /  Язык</text><text x="282" y="2982" font-size="23" fill="#192c44" font-weight="700">Собственные параметры типов у методов</text><text x="282" y="3013" font-size="18" fill="#192c44" font-weight="400">Методы могут объявлять параметры типов. Методы интерфейсов — по-прежнему нет;</text><text x="282" y="3037" font-size="18" fill="#192c44" font-weight="400">generic-метод не реализует метод интерфейса.</text></a><text x="48" y="3129" font-size="16" fill="#192c44" font-weight="400">Источники: go.dev · Нажмите на карточку, чтобы открыть официальный документ.</text></g></svg>