<svg xmlns="http://www.w3.org/2000/svg" width="600" height="498" viewBox="0 0 600 498" role="img" aria-labelledby="title desc"><title id="title">nil-получатель может войти в метод</title><desc id="desc">У e есть динамический тип *E и его метод Error. Метод получает nil-указатель, проверяет его до разыменования и возвращает &quot;empty&quot;. Паники нет.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185bc7"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#192c44}.title{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#52657c}.bit{font-family:monospace;font-size:28px}.value{fill:#e8effb;stroke:#185bc7;stroke-width:1.5}.shared{fill:#e8f5f1;stroke:#23715d;stroke-width:1.5}.stop{fill:#fff1e9;stroke:#ab4c21;stroke-width:1.5}.empty{fill:#f2f4f7;stroke:#8796a8;stroke-width:1.5}.arrow{fill:none;stroke:#185bc7;stroke-width:2.5}.line{fill:none;stroke:#8796a8;stroke-width:2}</style><rect width="600" height="498" fill="#fff"/><text x="28" y="44" class="title">nil-получатель может войти в метод</text><rect x="28" y="80" width="544" height="94" rx="10" class="value"/><text x="46" y="111" class="label">e: error</text><text x="46" y="145" class="body">(тип *E, значение nil)</text><path d="M 300 174 V 216" class="arrow" marker-end="url(#tip)"/><text x="322" y="200" class="small">e.Error()</text><rect x="28" y="230" width="544" height="94" rx="10" class="shared"/><text x="46" y="261" class="label">(*E).Error: получатель e == nil</text><text x="46" y="295" class="body">Проверка if e == nil → true</text><path d="M 300 324 V 366" class="arrow" marker-end="url(#tip)"/><text x="322" y="350" class="small">выбранная ветка</text><rect x="28" y="380" width="544" height="86" rx="10" class="value"/><text x="46" y="411" class="label">return &quot;empty&quot;</text><text x="46" y="445" class="body">До обращения к полям дело не доходит</text></svg>
